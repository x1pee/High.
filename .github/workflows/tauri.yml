name: Tauri native builds
on:
  push:
    tags: ["v2.*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Build Android for QA, or all native platforms"
        type: choice
        options: [android, all]
        default: android
permissions:
  contents: read
jobs:
  desktop:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'all'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            command: npm run tauri -- build --bundles appimage --config src-tauri/tauri.qa.conf.json
            artifact: src-tauri/target/release/bundle/appimage/*.AppImage
          - os: macos-latest
            command: npm run tauri -- build --bundles app --config src-tauri/tauri.qa.conf.json
            artifact: src-tauri/target/release/bundle/macos/*.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: ${{ matrix.command }}
        env:
          VYSHE_INSTALLED_BUILD: "1"
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: tar -czf src-tauri/target/release/bundle/macos/High-macos-arm64-preview.tar.gz -C src-tauri/target/release/bundle/macos High.app
      - uses: actions/upload-artifact@v4
        with:
          name: high-tauri-${{ matrix.os }}-${{ github.ref_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run android:init -- --ci
      - run: npm run android:build -- --target aarch64 --apk
        env:
          VYSHE_INSTALLED_BUILD: "1"
      - name: Sign and verify release APK
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_CERT: ${{ secrets.ANDROID_SIGNING_CERT }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY"
          test -n "$ANDROID_SIGNING_CERT"
          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/high-android.pk8"
          printf '%s' "$ANDROID_SIGNING_CERT" | base64 --decode > "$RUNNER_TEMP/high-android.x509.pem"
          chmod 600 "$RUNNER_TEMP/high-android.pk8"
          mkdir -p android-release
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*release-unsigned.apk' -print -quit)
          test -n "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/high-aligned.apk"
          "$tools/apksigner" sign --key "$RUNNER_TEMP/high-android.pk8" --cert "$RUNNER_TEMP/high-android.x509.pem" --out android-release/High_2.0.0_android_arm64.apk "$RUNNER_TEMP/high-aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs android-release/High_2.0.0_android_arm64.apk
          "$tools/aapt" dump badging android-release/High_2.0.0_android_arm64.apk > "$RUNNER_TEMP/android-badging.txt"
          head -20 "$RUNNER_TEMP/android-badging.txt"
          sha256sum android-release/*.apk
          rm -f "$RUNNER_TEMP/high-android.pk8" "$RUNNER_TEMP/high-android.x509.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: high-tauri-android-release-${{ github.ref_name }}
          path: android-release/*.apk
          if-no-files-found: error
