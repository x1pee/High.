name: Windows portable release

on:
  push:
    tags: ["v1.9.*", "v2.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag"
        required: true
        default: "v2.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      # A trailing dot in the repository name breaks the Windows workspace.
      # Fetch into RUNNER_TEMP and keep authentication out of Git config/files.
      - name: Fetch tagged private source
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GH_BUILD_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag' }
          git init repo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C repo remote add origin "https://github.com/${{ github.repository }}.git"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_BUILD_TOKEN"))
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $auth"
          try {
            git -C repo fetch --depth 1 origin "refs/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw 'Private source fetch failed' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT,Env:GIT_CONFIG_KEY_0,Env:GIT_CONFIG_VALUE_0
          }
          git -C repo checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tagged source
        shell: pwsh
        working-directory: ${{ runner.temp }}/repo
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --jobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and sign portable Windows executable
        shell: pwsh
        working-directory: ${{ runner.temp }}/repo
        env:
          VYSHE_INSTALLED_BUILD: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          npm run pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag does not match package.json version' }
          $releaseDir = Join-Path $env:RUNNER_TEMP 'repo/release'
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          $exe = Join-Path $releaseDir "High_${version}_x64.exe"
          Copy-Item 'src-tauri/target/release/high.exe' $exe
          if (!(Test-Path -LiteralPath $exe)) { throw 'Portable EXE was not built' }
          if ((Get-Item -LiteralPath $exe).Length -gt 50MB) { throw 'Portable EXE exceeds the updater limit' }
          npx tauri signer sign --app-version $version $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/create-update-manifest.mjs "$exe.sig" (Join-Path $releaseDir 'latest.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem $releaseDir | Select-Object Name,Length
      - uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: High ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/repo/RELEASE-NOTES.md
          files: ${{ runner.temp }}/repo/release/*
          fail_on_unmatched_files: true
